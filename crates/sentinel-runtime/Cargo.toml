[package]
name        = "sentinel-runtime"
description = "Runtime library linked into emitted Sentinel programs"

edition.workspace      = true
rust-version.workspace = true
version.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true

[lib]
# Two crate-types so the runtime is consumable both from Rust code
# (the `lib` rlib, used by sentinel-driver's tests if it ever wants
# to call the runtime directly) and from the C ABI (the `staticlib`
# .a archive, linked into emitted Sentinel programs by the system
# cc per ADR 0010 D11 and the C0.4 plan).
crate-type = ["lib", "staticlib"]

[dependencies]
tracing    = { workspace = true }
thiserror  = { workspace = true }
# ADR 0071 M1.4b: the `Mutex<T>` runtime cell uses `parking_lot::Mutex::try_lock_for`
# for the always-on `LockTimeout` deadlock tier (D5). Workspace-pinned; already a
# workspace dep (the broker uses it).
parking_lot = { workspace = true }
# C1.6 / ADR 0015 D9: wraps libc malloc for sentinel_alloc.
# Sentinel programs link with the C runtime, so using libc malloc
# directly (rather than Rust's allocator) avoids mixing allocators.
libc       = "0.2"
# C5.4 / ADR 0028: the Phase A broker backs the scope-arena C-ABI
# (sentinel_arena_enter/alloc/exit). Additive at C5.4 (1/N) — codegen
# does not call these yet.
sentinel-broker = { path = "../sentinel-broker" }

[lints.rust]
unsafe_code = "allow"
