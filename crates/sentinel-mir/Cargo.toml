[package]
name        = "sentinel-mir"
description = "SSA-form mid-level IR with optimizations"

edition.workspace      = true
rust-version.workspace = true
version.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true

[dependencies]
sentinel-ast     = { path = "../sentinel-ast" }
sentinel-types   = { path = "../sentinel-types" }
# `lower_to_mir` keys its SSA variable environment by `VarId`.
sentinel-resolve = { path = "../sentinel-resolve" }

[dev-dependencies]
# Exercising `lower_to_mir` end-to-end needs a real `TypedProgram`,
# which is not `Default`-constructible — build one through the pipeline
# (parse → resolve → check), mirroring sentinel-hir's tests.
sentinel-syntax  = { path = "../sentinel-syntax" }

[lints.rust]
unsafe_code = "deny"