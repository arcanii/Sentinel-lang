[package]
name        = "sentinel-hir"
description = "Typed high-level IR with all qualifiers resolved"

edition.workspace      = true
rust-version.workspace = true
version.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true

[dependencies]
sentinel-types        = { path = "../sentinel-types" }
sentinel-borrow-check = { path = "../sentinel-borrow-check" }

[dev-dependencies]
# Exercising `lower_to_hir` end-to-end needs a real `TypedProgram`,
# which is not `Default`-constructible — build one via the pipeline.
sentinel-syntax  = { path = "../sentinel-syntax" }
sentinel-resolve = { path = "../sentinel-resolve" }

[lints.rust]
unsafe_code = "deny"