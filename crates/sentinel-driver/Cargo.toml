[package]
name        = "sentinel-driver"
description = "snc compiler driver and command-line interface"

edition.workspace      = true
rust-version.workspace = true
version.workspace      = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true

[[bin]]
name = "snc"
path = "src/main.rs"

[dependencies]
sentinel-base         = { path = "../sentinel-base" }
sentinel-borrow-check = { path = "../sentinel-borrow-check" }
sentinel-codegen      = { path = "../sentinel-codegen" }
sentinel-resolve      = { path = "../sentinel-resolve" }
sentinel-syntax       = { path = "../sentinel-syntax" }
sentinel-types        = { path = "../sentinel-types" }

miette     = { workspace = true, features = ["fancy"] }
salsa      = { workspace = true }
tracing    = { workspace = true }
thiserror  = { workspace = true }

[lints.rust]
unsafe_code = "deny"